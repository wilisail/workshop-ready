<title id="figure-title">3. Prototype data flow: review, evaluate, then plan inspections</title>
<desc id="figure-description">Saved bead images are counted and reviewed. QA records are entered separately with stage and outcome context; there is no automatic image-to-QA link. A recorded study supports a small numeric model and held-out baseline comparisons. Inspection priorities are rule-based, with human decisions and audit exports.</desc>
