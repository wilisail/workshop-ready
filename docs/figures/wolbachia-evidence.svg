<title id="figure-title">2. Wolbachia field evidence: three distinct observation streams</title>
<desc id="figure-description">Release containers produce mosquitoes and supply stage-aware QA observations. Adult monitoring traps supply specimens for species identification and laboratory infection assays. Dengue surveillance supplies clinical outcomes for a separate epidemiological design. None of these measurements substitutes for another.</desc>
